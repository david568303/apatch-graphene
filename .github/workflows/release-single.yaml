name: Release single device

on:
  workflow_call:
    inputs:
      device-id:
        type: string
      skip-rootless:
        description: skip building the rootless OTA
        type: boolean
        default: false
      skip-apatch:
        description: skip building the APatch OTA
        type: boolean
        default: false
      apatch-version:
        description: APatch version or latest
        type: string
        default: ''
      kernelpatch-version:
        description: KernelPatch version, latest, or apatch for the manager-pinned version
        type: string
        default: ''
      kernelpatch-commit:
        description: Optional pinned KernelPatch source commit for a test build
        type: string
        default: ''
      ota-version:
        description: GrapheneOS OTA version or latest
        type: string
        default: ''
      force-build:
        description: force building an existing GrapheneOS device/flavor release
        type: boolean
        default: false
      force-ota-server-upload:
        description: force updating the OTA server feed
        type: boolean
        default: false
      upload-test-ota:
        description: publish to the test feed
        type: boolean
        default: false
      skip-release:
        description: build and validate without publishing
        type: boolean
        default: false
      allow-apatch-release:
        description: allow publishing APatch release assets (APatch is otherwise release-gated)
        type: boolean
        default: false
      skip-ota-server-upload:
        description: publish release assets but do not update the Custota OTA feed
        type: boolean
        default: false
      release-tag-suffix:
        description: suffix appended to the GitHub release tag (e.g. -apatch for a separate release)
        type: string
        default: ''
      release-prerelease:
        description: mark the GitHub release as a pre-release
        type: boolean
        default: false
      updater-feed:
        description: ship the APatch OTA with the Updater overlay and publish it to the rolling updater feed
        type: boolean
        default: false

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      device-id:
        description: Device ID
        required: true
      skip-rootless:
        description: skip building rootless OTA
        type: boolean
        required: false
      skip-apatch:
        description: skip building the APatch OTA
        type: boolean
        required: false
        default: false
      upload-test-ota:
        description: Upload OTA to test folder
        required: false
        type: boolean
      force-build:
        description: Force artifacts to be built and uploaded to release if non-existing
        required: false
        type: boolean
      force-ota-server-upload:
        description: Force OTA server upload
        required: false
        type: boolean
      skip-release:
        description: Skip release (build only)
        required: false
        type: boolean
      allow-apatch-release:
        description: allow publishing APatch release assets
        required: false
        type: boolean
      skip-ota-server-upload:
        description: publish release assets but do not update the Custota OTA feed
        required: false
        type: boolean
      ota-version:
        description: OTA version
        required: false
      apatch-version:
        description: APatch version or latest
        required: false
      kernelpatch-version:
        description: KernelPatch version, latest, or apatch for the manager-pinned version
        required: false
      kernelpatch-commit:
        description: Optional pinned KernelPatch source commit for a test build
        required: false
      release-tag-suffix:
        description: suffix appended to the GitHub release tag (e.g. -apatch for a separate release)
        required: false
      release-prerelease:
        description: mark the GitHub release as a pre-release
        type: boolean
        required: false
      updater-feed:
        description: ship the APatch OTA with the Updater overlay and publish it to the rolling updater feed
        type: boolean
        required: false

permissions:
  contents: write

jobs:
  build-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Make sure to not waste hours when some command does not return 
    steps:
      - uses: actions/checkout@v7
        with:
          # Allow for switching to github-pages branch
          fetch-depth: 0
      - name: Set inputs
        # Empty means, use version defined in rooted-ota.sh
        env:
          DEVICE_ID_INPUT: ${{ inputs.device-id || 'mustang' }}
          APATCH_VERSION_INPUT: ${{ inputs.apatch-version || '' }}
          KERNELPATCH_VERSION_INPUT: ${{ inputs.kernelpatch-version || '' }}
          KERNELPATCH_COMMIT_INPUT: ${{ inputs.kernelpatch-commit || '' }}
          OTA_VERSION_INPUT: ${{ inputs.ota-version || '' }}
          SKIP_ROOTLESS_INPUT: ${{ toJSON(inputs.skip-rootless) == 'true' && 'true' || 'false' }}
          SKIP_APATCH_INPUT: ${{ toJSON(inputs.skip-apatch) == 'true' && 'true' || 'false' }}
          FORCE_OTA_SERVER_UPLOAD_INPUT: ${{ toJSON(inputs.force-ota-server-upload) == 'true' && 'true' || 'false' }}
          FORCE_BUILD_INPUT: ${{ toJSON(inputs.force-build) == 'true' && 'true' || 'false' }}
          UPLOAD_TEST_OTA_INPUT: ${{ toJSON(inputs.upload-test-ota) == 'true' && 'true' || 'false' }}
          SKIP_RELEASE_INPUT: ${{ toJSON(inputs.skip-release) == 'true' && 'true' || 'false' }}
          ALLOW_APATCH_RELEASE_INPUT: ${{ toJSON(inputs.allow-apatch-release) == 'true' && 'true' || 'false' }}
          SKIP_OTA_SERVER_UPLOAD_INPUT: ${{ toJSON(inputs.skip-ota-server-upload) == 'true' && 'true' || 'false' }}
          RELEASE_TAG_SUFFIX_INPUT: ${{ inputs.release-tag-suffix || '' }}
          RELEASE_PRERELEASE_INPUT: ${{ toJSON(inputs.release-prerelease) == 'true' && 'true' || 'false' }}
          UPDATER_FEED_INPUT: ${{ toJSON(inputs.updater-feed) == 'true' && 'true' || 'false' }}
        run: |
          {
            echo "DEVICE_ID=$(echo "$DEVICE_ID_INPUT" | xargs)"
            echo "APATCH_VERSION=$(echo "$APATCH_VERSION_INPUT" | xargs)"
            echo "KERNELPATCH_VERSION=$(echo "$KERNELPATCH_VERSION_INPUT" | xargs)"
            echo "KERNELPATCH_COMMIT=$(echo "$KERNELPATCH_COMMIT_INPUT" | xargs)"
            echo "OTA_VERSION=$(echo "$OTA_VERSION_INPUT" | xargs)"
            echo "FORCE_OTA_SERVER_UPLOAD=$FORCE_OTA_SERVER_UPLOAD_INPUT"
            echo "FORCE_BUILD=$FORCE_BUILD_INPUT"
            echo "UPLOAD_TEST_OTA=$UPLOAD_TEST_OTA_INPUT"
            echo "SKIP_ROOTLESS=$SKIP_ROOTLESS_INPUT"
            echo "SKIP_APATCH=$SKIP_APATCH_INPUT"
            echo "SKIP_RELEASE=$SKIP_RELEASE_INPUT"
            echo "ALLOW_APATCH_RELEASE=$ALLOW_APATCH_RELEASE_INPUT"
            echo "SKIP_OTA_SERVER_UPLOAD=$SKIP_OTA_SERVER_UPLOAD_INPUT"
            echo "RELEASE_TAG_SUFFIX=$(echo "$RELEASE_TAG_SUFFIX_INPUT" | xargs)"
            echo "RELEASE_PRERELEASE=$RELEASE_PRERELEASE_INPUT"
            echo "UPDATER_FEED=$UPDATER_FEED_INPUT"
          } >> "$GITHUB_ENV"
      - name: Validate signing secrets
        env:
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
        run: |
          missing=()
          for name in PASSPHRASE_AVB PASSPHRASE_OTA KEY_AVB_BASE64 KEY_OTA_BASE64 CERT_OTA_BASE64; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required repository secrets: ${missing[*]}" >&2
            exit 1
          fi
      - name: Install Updater overlay build tools
        if: ${{ inputs.updater-feed }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner libandroid-23-java
      # jq, curl and git are preinstalled on ubuntu-latest; no apt step needed.
      - name: release
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
        run: |
          if [[ $SKIP_RELEASE == 'true' ]]; then
            bash -c '. rooted-ota.sh && createRootedOta && createOtaServerData'
          else
            bash -c '. rooted-ota.sh && createAndReleaseRootedOta'
          fi
