name: Release single device

# Builds the APatch OTA of one device and puts it into the rolling-ota-feed
# release, replacing that device's older files. Run it by hand to rebuild one
# device; "Automatic APatch OTAs" calls it for every device that needs a build.
#
# With skip-release it only builds and verifies, and attaches the OTA to the
# run as a download instead of publishing it: that is how to test a build.

on:
  workflow_call:
    inputs:
      device-id:
        type: string
      skip-rootless:
        description: skip building the rootless OTA (it can no longer be released)
        type: boolean
        default: true
      skip-apatch:
        description: skip building the APatch OTA
        type: boolean
        default: false
      apatch-version:
        description: APatch version or latest
        type: string
        default: ''
      kernelpatch-version:
        description: KernelPatch version, latest, or apatch for the manager-pinned version
        type: string
        default: ''
      kernelpatch-commit:
        description: Optional pinned KernelPatch source commit for a test build
        type: string
        default: ''
      ota-version:
        description: GrapheneOS OTA version or latest
        type: string
        default: ''
      force-build:
        description: build even if the feed already has this device's OTA for the version
        type: boolean
        default: false
      skip-release:
        description: build and validate without publishing; the OTA is attached to the run
        type: boolean
        default: false
      allow-apatch-release:
        description: allow publishing APatch OTAs (APatch is otherwise release-gated)
        type: boolean
        default: false

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      device-id:
        description: Device ID
        required: true
      skip-rootless:
        description: skip building the rootless OTA (it can no longer be released)
        type: boolean
        default: true
      skip-apatch:
        description: skip building the APatch OTA
        type: boolean
        default: false
      force-build:
        description: build even if the feed already has this device's OTA for the version
        type: boolean
        default: false
      skip-release:
        description: Dry run - build and verify only, the OTA is attached to the run
        type: boolean
        default: false
      allow-apatch-release:
        description: allow publishing the APatch OTA to the feed
        type: boolean
        default: false
      ota-version:
        description: OTA version
        required: false
      apatch-version:
        description: APatch version or latest
        required: false
      kernelpatch-version:
        description: KernelPatch version, latest, or apatch for the manager-pinned version
        required: false
      kernelpatch-commit:
        description: Optional pinned KernelPatch source commit for a test build
        required: false

permissions:
  contents: write

jobs:
  build-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Make sure to not waste hours when some command does not return
    # The feed is shared state: never let two runs replace the same device's files at once.
    concurrency:
      group: ota-feed-${{ inputs.device-id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Set inputs
        # Empty means, use version defined in rooted-ota.sh
        env:
          DEVICE_ID_INPUT: ${{ inputs.device-id || 'mustang' }}
          APATCH_VERSION_INPUT: ${{ inputs.apatch-version || '' }}
          KERNELPATCH_VERSION_INPUT: ${{ inputs.kernelpatch-version || '' }}
          KERNELPATCH_COMMIT_INPUT: ${{ inputs.kernelpatch-commit || '' }}
          OTA_VERSION_INPUT: ${{ inputs.ota-version || '' }}
          SKIP_ROOTLESS_INPUT: ${{ toJSON(inputs.skip-rootless) == 'false' && 'false' || 'true' }}
          SKIP_APATCH_INPUT: ${{ toJSON(inputs.skip-apatch) == 'true' && 'true' || 'false' }}
          FORCE_BUILD_INPUT: ${{ toJSON(inputs.force-build) == 'true' && 'true' || 'false' }}
          SKIP_RELEASE_INPUT: ${{ toJSON(inputs.skip-release) == 'true' && 'true' || 'false' }}
          ALLOW_APATCH_RELEASE_INPUT: ${{ toJSON(inputs.allow-apatch-release) == 'true' && 'true' || 'false' }}
        run: |
          {
            echo "DEVICE_ID=$(echo "$DEVICE_ID_INPUT" | xargs)"
            echo "APATCH_VERSION=$(echo "$APATCH_VERSION_INPUT" | xargs)"
            echo "KERNELPATCH_VERSION=$(echo "$KERNELPATCH_VERSION_INPUT" | xargs)"
            echo "KERNELPATCH_COMMIT=$(echo "$KERNELPATCH_COMMIT_INPUT" | xargs)"
            echo "OTA_VERSION=$(echo "$OTA_VERSION_INPUT" | xargs)"
            echo "SKIP_ROOTLESS=$SKIP_ROOTLESS_INPUT"
            echo "SKIP_APATCH=$SKIP_APATCH_INPUT"
            echo "SKIP_RELEASE=$SKIP_RELEASE_INPUT"
            echo "ALLOW_APATCH_RELEASE=$ALLOW_APATCH_RELEASE_INPUT"
            # A dry run is for testing a build, so it must not be skipped because the feed has it already,
            # and its files must survive until they are attached to the run.
            if [[ "$SKIP_RELEASE_INPUT" == 'true' ]]; then
              echo "FORCE_BUILD=true"
              echo "SKIP_CLEANUP=true"
            else
              echo "FORCE_BUILD=$FORCE_BUILD_INPUT"
            fi
          } >> "$GITHUB_ENV"
      - name: Validate signing secrets
        env:
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
        run: |
          missing=()
          for name in PASSPHRASE_AVB PASSPHRASE_OTA KEY_AVB_BASE64 KEY_OTA_BASE64 CERT_OTA_BASE64; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required repository secrets: ${missing[*]}" >&2
            exit 1
          fi
      - name: Install Updater overlay build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner libandroid-23-java
      # jq, curl and git are preinstalled on ubuntu-latest; no apt step needed.
      - name: release
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
        run: |
          if [[ $SKIP_RELEASE == 'true' ]]; then
            bash -c '. rooted-ota.sh && createRootedOta'
          else
            bash -c '. rooted-ota.sh && createAndReleaseRootedOta'
          fi
      - name: Attach the dry-run OTA
        if: ${{ inputs.skip-release }}
        uses: actions/upload-artifact@v7
        with:
          name: ota-${{ env.DEVICE_ID }}
          path: .tmp/patched/*.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
