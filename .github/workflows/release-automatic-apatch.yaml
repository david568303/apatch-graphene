name: Automatic APatch OTAs

# Builds the APatch (KernelPatch) OTA of every device for each new GrapheneOS
# version and publishes them as ONE normal GitHub release per version (tag =
# the version, e.g. 2026102101). Every OTA carries an overlay that points the
# on-device Updater at .../releases/latest/download/, so the release holds the
# Updater's own layout per device (<device>-ota_update-<version>.zip plus one
# metadata file per channel) and the phones update from it by themselves.
#
# A release is created as "not Latest" and only promoted by the `publish` job
# once it holds every device, so an Updater never sees half a release. It does
# NOT touch the Custota feed.
#
# A single cheap `detect` job decides which devices still need a build for the
# current version, so idle runs cost one job instead of one per device. A run
# after a failure builds only what is missing and then promotes the release.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-apatch-otas
  cancel-in-progress: false

env:
  DEVICES: >-
    stallion rango mustang blazer frankel
    tegu comet komodo caiman tokay
    akita husky shiba felix tangorpro
    lynx cheetah panther bluejay raven
    oriole

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
      any: ${{ steps.gate.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide which devices need a build
        id: gate
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c ". rooted-ota.sh && emitBuildMatrix $DEVICES" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      # Limit simultaneous multi-gigabyte downloads.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/release-single.yaml
    secrets: inherit
    with:
      device-id: ${{ matrix.device-id }}
      skip-rootless: true
      skip-apatch: false
      # Not the Custota feed: the Updater overlay is how phones get updates.
      allow-apatch-release: true
      skip-ota-server-upload: true

  publish:
    needs: [detect, release]
    # Also runs when some devices failed or nothing needed building: it only
    # promotes a release that is already complete, and every run retries.
    if: ${{ !cancelled() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Mark the newest release Latest once it holds every device
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c ". rooted-ota.sh && markReleaseLatestIfComplete $DEVICES"
