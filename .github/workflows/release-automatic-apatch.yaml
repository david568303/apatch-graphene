name: Automatic APatch OTAs

# Builds the APatch (KernelPatch) OTA of every device that is not yet on the
# current GrapheneOS version and publishes it to the rolling-ota-feed release,
# replacing that device's older files. There is no release per version: the
# feed only ever holds the newest OTAs. Every OTA carries an overlay that points
# the on-device Updater at that release, so phones update from it by themselves,
# and people can download from it by hand.
#
# A single cheap `detect` job decides which devices still need a build, so idle
# runs cost one job instead of one per device. After the builds the `finalize`
# job checks that every device is in, refreshes the release notes (which say
# what changed) and, once their week is up, deletes the old ota and ota-test
# feeds. A run after a failure builds only what is missing.
#
# To build one device, run "Release single device".

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-apatch-otas
  cancel-in-progress: false

env:
  DEVICES: >-
    stallion rango mustang blazer frankel
    tegu comet komodo caiman tokay
    akita husky shiba felix tangorpro
    lynx cheetah panther bluejay raven
    oriole

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
      any: ${{ steps.gate.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide which devices need a build
        id: gate
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c ". rooted-ota.sh && emitBuildMatrix $DEVICES" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      # Limit simultaneous multi-gigabyte downloads.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/release-single.yaml
    secrets: inherit
    with:
      device-id: ${{ matrix.device-id }}
      skip-rootless: true
      skip-apatch: false
      allow-apatch-release: true

  finalize:
    needs: [detect, release]
    # Also runs when some devices failed or nothing needed building: it only
    # reports and tidies up, and every scheduled run retries.
    if: ${{ !cancelled() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check the feed is complete and refresh what is shared
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT: ${{ needs.detect.outputs.any }}
        run: bash -c ". rooted-ota.sh && finalizeFeed $DEVICES"
