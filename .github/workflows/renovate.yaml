name: Renovate

on:
  schedule:
    - cron: '0 20 * * *'

  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options:
          - info
          - debug
          - trace

  # Rebase open PRs on push
  push:
    branches: [main]

  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - .github/workflows/renovate.yaml

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  renovate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: .github/renovate.json5
          # The built-in token cannot update workflow files, and PRs it opens do
          # not trigger other workflows, so automerged updates would go untested.
          # Use a fine-grained PAT when available.
          # https://docs.renovatebot.com/modules/platform/github/#running-using-a-fine-grained-token
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
