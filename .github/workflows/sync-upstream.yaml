name: Sync upstream

on:
  # GitHub cannot subscribe a fork directly to another repository's push event.
  # Poll at offset minutes to avoid the busiest points of the hour.
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # The built-in token is not allowed to push changes to
          # .github/workflows, which upstream touches regularly (e.g. Renovate
          # bumping its action). A fine-grained PAT with Workflows write is required.
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN || github.token }}

      - name: Merge upstream main
        id: merge
        env:
          UPSTREAM_REPOSITORY: schnatterer/rooted-graphene
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          upstream_ref="upstream/$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "$upstream_ref" HEAD; then
            echo "Already synchronized with $UPSTREAM_REPOSITORY@$UPSTREAM_BRANCH."
            echo '### Upstream sync' >> "$GITHUB_STEP_SUMMARY"
            echo 'No new upstream commits were found.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          before="$(git rev-parse HEAD)"
          if ! git merge --no-ff --no-edit "$upstream_ref"; then
            conflicts="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git merge --abort || true
            # A conflict stays until someone merges upstream by hand, and this
            # job polls every 15 minutes: failing each time sends a failure mail
            # each time. Hand the conflict to the steps below, which fail once
            # per conflict and only warn on later polls. The merge base moves
            # only when upstream is merged, so it identifies the conflict.
            {
              echo 'conflict=true'
              echo "episode=$(git merge-base HEAD "$upstream_ref")"
              echo "files=$conflicts"
              echo "upstream=$(git rev-parse --short "$upstream_ref")"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          after="$(git rev-parse HEAD)"
          if ! git push origin HEAD:main; then
            if ! git diff --quiet "$before" "$after" -- .github/workflows; then
              echo "::error::The merge changes workflow files, which requires the SYNC_UPSTREAM_TOKEN secret (fine-grained PAT with Contents and Workflows write)."
            fi
            exit 1
          fi

          {
            echo '### Upstream sync'
            echo
            echo "Merged \`$UPSTREAM_REPOSITORY@$UPSTREAM_BRANCH\` into \`main\`."
            echo
            echo "Fork changed from \`$before\` to \`$after\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Was this conflict reported already?
        id: reported
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .sync-upstream-conflict
          key: sync-upstream-conflict-${{ steps.merge.outputs.episode }}

      - name: Conflict already reported
        if: steps.merge.outputs.conflict == 'true' && steps.reported.outputs.cache-hit == 'true'
        run: |
          echo "::warning::Upstream still conflicts with fork-specific changes in: ${{ steps.merge.outputs.files }}(already reported; merge upstream by hand to resolve)."
          {
            echo '### Upstream sync'
            echo
            echo "Upstream \`${{ steps.merge.outputs.upstream }}\` still conflicts with the fork in: ${{ steps.merge.outputs.files }}"
            echo
            echo 'This was reported by an earlier failed run. Nothing was pushed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remember that this conflict is reported
        if: steps.merge.outputs.conflict == 'true' && steps.reported.outputs.cache-hit != 'true'
        run: date -u +%FT%TZ > .sync-upstream-conflict

      - name: Save the report marker
        if: steps.merge.outputs.conflict == 'true' && steps.reported.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .sync-upstream-conflict
          key: sync-upstream-conflict-${{ steps.merge.outputs.episode }}

      - name: Report the new conflict
        if: steps.merge.outputs.conflict == 'true' && steps.reported.outputs.cache-hit != 'true'
        run: |
          echo "::error::Upstream changes conflict with fork-specific changes in: ${{ steps.merge.outputs.files }}. No commit was pushed. Merge upstream by hand; this is reported once, later runs only warn."
          exit 1
