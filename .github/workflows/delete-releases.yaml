name: Delete releases

# Removes obsolete releases (and their git tags) in one go. Needs the word
# DELETE as confirmation, and does not touch the release currently marked Latest
# unless allow-latest is set.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags to delete, separated by spaces
        required: true
      confirm:
        description: Type DELETE to confirm
        required: true
      allow-latest:
        description: Also allow deleting the release currently marked Latest
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete the releases and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
          CONFIRM: ${{ inputs.confirm }}
          ALLOW_LATEST: ${{ inputs.allow-latest }}
        run: |
          if [[ "$CONFIRM" != 'DELETE' ]]; then
            echo "Not confirmed: type DELETE in the confirm field." >&2
            exit 1
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName || true)
          for tag in $TAGS; do
            if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Refusing the odd-looking tag '$tag'." >&2
              exit 1
            fi
            if [[ "$tag" == "$latest" && "$ALLOW_LATEST" != 'true' ]]; then
              echo "Refusing to delete $tag: it is the Latest release." >&2
              exit 1
            fi
          done
          for tag in $TAGS; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Deleted $tag"
          done
